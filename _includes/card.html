{%- assign s = include.story -%}
<a class="card" href="{{ s.url | relative_url }}" style="--topic: {{ s.colour }}">
  {%- if s.image %}
  <div class="card-media" style="background-color: {{ s.image.color }}">
    <img src="{{ s.image.card.url | relative_url }}"
         srcset="{{ s.image.card.url | relative_url }} {{ s.image.card.w }}w, {{ s.image.medium.url | relative_url }} {{ s.image.medium.w }}w"
         sizes="(min-width: 760px) 340px, 100vw" width="{{ s.image.card.w }}" height="{{ s.image.card.h }}" alt="" loading="lazy" decoding="async">
  </div>
  {%- endif %}
  <div>
    <span class="kicker">{{ s.section_label }}</span>
    <h3>{{ s.title }}</h3>
    <p class="card-meta">{{ s.date | date: "%a %-d %b" }} · {{ s.places | map: "name" | join: ", " }}{% if s.updated %} · <span class="badge">Updated</span>{% endif %}</p>
  </div>
</a>
